name: Flutter checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check migration fixture bundle
        run: python3 tool/generate_migration_fixtures.py --check
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Browser regressions
        run: >-
          flutter test --platform chrome
          test/app_flow_test.dart
          test/command_center_test.dart
          test/groups_ui_test.dart
          test/photo_preview_test.dart
          test/twin_foundation_test.dart
          test/schema_migration_test.dart
          test/shared_core_ui_test.dart
          test/beef_module_test.dart
          test/beef_ui_test.dart
          test/dairy_module_test.dart
          test/dairy_ui_test.dart
      - name: Build web
        run: flutter build web --release
